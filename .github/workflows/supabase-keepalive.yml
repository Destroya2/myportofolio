name: Supabase Keepalive (Portfolio)

# Empêche la mise en pause automatique du projet Supabase (inactivité)
# en effectuant une petite requête de lecture toutes les 30 minutes.
# Si le projet est déjà suspendu, tente de le réveiller via le health endpoint.

on:
  schedule:
    - cron: '*/30 * * * *'  # toutes les 30 min
  workflow_dispatch:          # permet aussi un déclenchement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (avec retry)
        env:
          # La clé anon est PUBLIQUE (déjà présente dans le front-end) : OK en clair.
          SUPABASE_URL: 'https://wqzpyxqdrtnzbgegbdqk.supabase.co'
          SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxenB5eHFkcnRuemJnZWdiZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzE5OTIsImV4cCI6MjEwNTkwNzk5Mn0.VkZgU4uA3P6lhE-k4NsySAskAbNcy0GNWjr_2SmQQzc'
        run: |
          MAX_RETRIES=3
          DELAY=30

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "=== Tentative $attempt / $MAX_RETRIES ==="

            # --- 1) Ping REST API (table projects) ---
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 \
              "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" 2>/dev/null) || code="000"

            echo "REST API → HTTP $code"

            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then
              echo "✅ Supabase actif."
              exit 0
            fi

            # --- 2) Si le DNS ne résout pas (projet suspendu), tenter le health endpoint ---
            if [ "$code" = "000" ]; then
              echo "⚠️  DNS injoignable — projet probablement suspendu."
              echo "   Tentative via /health/v1 ..."
              health=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 \
                "$SUPABASE_URL/health/v1" 2>/dev/null) || health="000"
              echo "Health → HTTP $health"

              if [ "$health" -ge 200 ] 2>/dev/null && [ "$health" -lt 400 ] 2>/dev/null; then
                echo "🔄 Le health endpoint répond — le projet est en cours de réveil."
                echo "   On attend ${DELAY}s et on re-tente le REST API..."
                sleep $DELAY
                continue
              fi
            fi

            # --- 3) Échec de cette tentative ---
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "❌ Échec. Re-dans ${DELAY}s..."
              sleep $DELAY
            fi
          done

          echo ""
          echo "❌ Supabase toujours injoignable après $MAX_RETRIES tentatives."
          exit 1
